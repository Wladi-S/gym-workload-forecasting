[project]
name = "gym-scraper"
version = "0.1.0"
description = "Gym workload scraper logic"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "requests>=2.32",
]

[project.scripts]
gym-scraper = "gym_scraper.gym_scraper:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gym_scraper"]
