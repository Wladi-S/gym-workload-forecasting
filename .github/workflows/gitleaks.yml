name: Gitleaks
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['*']
concurrency:
  cancel-in-progress: false
  group: gitleaks-${{ github.ref }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
