[project]
name = "pipeline"
requires-python = ">=3.13,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.14",
    "psycopg[binary]>=3.3.4",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "pipeline"
registry_modules = [
    "pipeline.components.*",
]
